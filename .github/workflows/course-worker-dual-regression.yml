name: Course Worker Final Acceptance

on:
  workflow_dispatch:
    inputs:
      course_a:
        description: First current-semester course
        required: true
        default: 国际法学
        type: string
      course_b:
        description: Second current-semester course
        required: true
        default: 习近平法治思想研究专题
        type: string

permissions:
  contents: read

concurrency:
  group: course-worker-production
  cancel-in-progress: false

jobs:
  final-acceptance:
    name: Final two-course acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_CONTROL_PLANE_URL: ${{ secrets.COURSE_CONTROL_PLANE_URL }}
      COURSE_WORKER_SECRET: ${{ secrets.COURSE_WORKER_SECRET }}
      COURSE_WORKER_OWNER_ID: ${{ secrets.COURSE_WORKER_OWNER_ID }}
      PKU_USERNAME: ${{ secrets.PKU_USERNAME }}
      PKU_PASSWORD: ${{ secrets.PKU_PASSWORD }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      COURSE_TEST_A: ${{ inputs.course_a }}
      COURSE_TEST_B: ${{ inputs.course_b }}
      COURSE_WORKER_ID: gha-final:${{ github.run_id }}
      COURSE_ASR_ALLOW_PAID: "1"
      COURSE_ASR_MAX_TASK_SECONDS: "16200"
      COURSE_ASR_DAILY_MAX_SECONDS: "0"
      COURSE_ASR_MAX_TASK_COST_CNY: "2"
      COURSE_ASR_DAILY_MAX_COST_CNY: "0"
      COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS: "300000"
      COURSE_CONTROL_PLANE_TIMEOUT_MS: "120000"
      COURSE_DOWNLOAD_CONCURRENCY: "4"
      COURSE_HEADLESS: "1"
      COURSE_PROXY_MODE: off
      COURSE_MEDIA_ROUTE: inherit
      COURSE_KEEP_TRANSCRIPT_LOCAL: "0"
      COURSE_FINAL_REPORT_DIR: /data/final-acceptance
      COURSE_TEST_CLAIM_WAIT_MS: "3000000"

    steps:
      - name: Check out acceptance support files
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Check out pinned worker
        uses: actions/checkout@v5
        with:
          ref: f626cbe889f8ae9aa042309784d86857aba11c3b
          path: worker
          persist-credentials: false

      - name: Verify accepted worker features
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nonNegativeNumber' worker/scripts/course-worker/asr-budget.mjs
          grep -q 'const queues = new Map()' worker/scripts/course-worker/production-cycle-core.mjs
          grep -q 'const queues = new Map()' worker/scripts/course-worker/llm-drain-core.mjs
          echo 'Pinned multicourse worker is present.'

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            COURSE_CONTROL_PLANE_URL
            COURSE_WORKER_SECRET
            PKU_USERNAME
            PKU_PASSWORD
            DASHSCOPE_API_KEY
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ENDPOINT
            R2_BUCKET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

      - name: Build pinned worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file worker/deploy/course-worker/Dockerfile \
            --tag law-tech-course-worker:final-acceptance \
            worker

      - name: Prepare acceptance storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-worker-data/final-acceptance"
          chmod 700 "$RUNNER_TEMP/course-worker-data"

      - name: Run real two-course regression with safe progress
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -v "$GITHUB_WORKSPACE/.github/scripts/course-worker-final-dual-regression.mjs:/tmp/final-dual.mjs:ro" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_TEST_A \
            -e COURSE_TEST_B \
            -e COURSE_WORKER_ID \
            -e COURSE_ASR_ALLOW_PAID \
            -e COURSE_ASR_MAX_TASK_SECONDS \
            -e COURSE_ASR_DAILY_MAX_SECONDS \
            -e COURSE_ASR_MAX_TASK_COST_CNY \
            -e COURSE_ASR_DAILY_MAX_COST_CNY \
            -e COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_DOWNLOAD_CONCURRENCY \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_KEEP_TRANSCRIPT_LOCAL \
            -e COURSE_FINAL_REPORT_DIR \
            -e COURSE_TEST_CLAIM_WAIT_MS \
            law-tech-course-worker:final-acceptance \
            node /tmp/final-dual.mjs

      - name: Run zero-cost idempotency verification
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -v "$GITHUB_WORKSPACE/.github/scripts/course-worker-idempotency-check.mjs:/tmp/idempotency.mjs:ro" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e COURSE_TEST_A \
            -e COURSE_TEST_B \
            -e COURSE_HEADLESS \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_FINAL_REPORT_DIR \
            law-tech-course-worker:final-acceptance \
            node /tmp/idempotency.mjs

      - name: Print safe acceptance summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/course-worker-data/final-acceptance"
          for file in dual-regression.json idempotency.json; do
            if [[ -f "$base/$file" ]]; then
              echo "=== $file ==="
              jq '{
                event,
                success,
                discovery,
                initial,
                mediaResults,
                final,
                firstAddedCount,
                secondAddedCount,
                before,
                after,
                asrInvoked,
                mediaRunnerInvoked,
                llmRunnerInvoked,
                error: (.error.code // "")
              }' "$base/$file"
            fi
          done

      - name: Upload safe acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-worker-final-acceptance-safe-report
          path: |
            ${{ runner.temp }}/course-worker-data/final-acceptance/*.json
          if-no-files-found: error
          retention-days: 14
