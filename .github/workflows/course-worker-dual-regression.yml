name: Course Worker Dual Regression

on:
  workflow_dispatch:
    inputs:
      course_a:
        description: First current-semester course
        required: true
        default: 国际法学
        type: string
      course_b:
        description: Second current-semester course
        required: true
        default: 习近平法治思想研究专题
        type: string
      force_retry:
        description: Reopen completed/failed tasks and allow repeat billing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: course-worker-production
  cancel-in-progress: false

jobs:
  dual-regression:
    name: Two-course real regression
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_CONTROL_PLANE_URL: ${{ secrets.COURSE_CONTROL_PLANE_URL }}
      COURSE_WORKER_SECRET: ${{ secrets.COURSE_WORKER_SECRET }}
      COURSE_WORKER_OWNER_ID: ${{ secrets.COURSE_WORKER_OWNER_ID }}
      PKU_USERNAME: ${{ secrets.PKU_USERNAME }}
      PKU_PASSWORD: ${{ secrets.PKU_PASSWORD }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      COURSE_TEST_A: ${{ inputs.course_a }}
      COURSE_TEST_B: ${{ inputs.course_b }}
      COURSE_TEST_FORCE_RETRY: ${{ inputs.force_retry && '1' || '0' }}
      COURSE_WORKER_ID: gha-dual:${{ github.run_id }}
      COURSE_ASR_ALLOW_PAID: "1"
      COURSE_ASR_MAX_TASK_SECONDS: "16200"
      COURSE_ASR_DAILY_MAX_SECONDS: "0"
      COURSE_ASR_MAX_TASK_COST_CNY: "2"
      COURSE_ASR_DAILY_MAX_COST_CNY: "0"
      COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS: "300000"
      COURSE_CONTROL_PLANE_TIMEOUT_MS: "120000"
      COURSE_DOWNLOAD_CONCURRENCY: "4"
      COURSE_HEADLESS: "1"
      COURSE_PROXY_MODE: off
      COURSE_MEDIA_ROUTE: inherit
      COURSE_KEEP_TRANSCRIPT_LOCAL: "0"

    steps:
      - name: Check out workflow support files
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Check out worker branch
        uses: actions/checkout@v5
        with:
          ref: codex/course-worker-v009c
          path: worker
          persist-credentials: false

      - name: Verify multicourse V8 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nonNegativeNumber' worker/scripts/course-worker/asr-budget.mjs
          grep -q 'const queues = new Map()' worker/scripts/course-worker/production-cycle-core.mjs
          grep -q 'const queues = new Map()' worker/scripts/course-worker/llm-drain-core.mjs
          echo 'Multicourse V8 prerequisite is present.'

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            COURSE_CONTROL_PLANE_URL
            COURSE_WORKER_SECRET
            PKU_USERNAME
            PKU_PASSWORD
            DASHSCOPE_API_KEY
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ENDPOINT
            R2_BUCKET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

      - name: Build worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file worker/deploy/course-worker/Dockerfile \
            --tag law-tech-course-worker:dual-regression \
            worker

      - name: Prepare controlled regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-worker-data/dual-regression"
          chmod 700 "$RUNNER_TEMP/course-worker-data"

      - name: Run two-course end-to-end regression
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dual-regression.log"
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -v "$GITHUB_WORKSPACE/.github/scripts/course-worker-dual-regression.mjs:/tmp/dual-regression.mjs:ro" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_TEST_A \
            -e COURSE_TEST_B \
            -e COURSE_TEST_FORCE_RETRY \
            -e COURSE_WORKER_ID \
            -e COURSE_ASR_ALLOW_PAID \
            -e COURSE_ASR_MAX_TASK_SECONDS \
            -e COURSE_ASR_DAILY_MAX_SECONDS \
            -e COURSE_ASR_MAX_TASK_COST_CNY \
            -e COURSE_ASR_DAILY_MAX_COST_CNY \
            -e COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_DOWNLOAD_CONCURRENCY \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_KEEP_TRANSCRIPT_LOCAL \
            law-tech-course-worker:dual-regression \
            node /tmp/dual-regression.mjs >"$log" 2>&1
          status=$?
          set -e

          report="$RUNNER_TEMP/course-worker-data/dual-regression/report.json"
          if [[ -f "$report" ]]; then
            jq '{
              success: (.success // false),
              discovery: (.discovery // {}),
              selections: [
                (.selections // [])[] | {
                  slot,
                  startsAtText
                }
              ],
              media: [
                (.mediaResults // [])[] | {
                  slot,
                  status,
                  stage
                }
              ],
              final: [
                (.final // [])[] | {
                  slot,
                  stage,
                  errorKind,
                  errorCode,
                  retryable,
                  mediaDeleted: (.cleanup.mediaDeleted // false),
                  fragmentsDeleted: (.cleanup.fragmentsDeleted // false)
                }
              ],
              errorCode: (.error.code // "")
            }' "$report"
          fi

          if (( status != 0 )); then
            echo 'Two-course regression failed or stopped safely. Full content was kept out of this public log.'
            exit "$status"
          fi
          echo 'Two-course real regression completed successfully.'
