name: Docker ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an image to GHCR
        required: false
        default: false
        type: boolean
      multiarch:
        description: Publish both amd64 and arm64 when publish is enabled
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-ghcr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 70 || 20 }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether Docker build is required
        id: docker_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          required=true
          reason="push, tag, or manual run"

          diff_base=""
          diff_head=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            required=false
            reason="documentation-only pull request"
            diff_base="$BASE_SHA"
            diff_head="$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$GIT_REF" == "refs/heads/main" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            required=false
            reason="documentation-only main push"
            diff_base="$BEFORE_SHA"
            diff_head="$HEAD_SHA"
          fi

          if [[ -n "$diff_base" && -n "$diff_head" ]]; then
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                docs/*|*.md|*.mdx|.github/pull_request_template.md)
                  ;;
                *)
                  required=true
                  reason="build-relevant path: $path"
                  break
                  ;;
              esac
            done < <(git diff --name-only "$diff_base" "$diff_head")
          fi

          # This one-off rollback is deployed only to Vercel and the Vercel preview
          # already performs the production-equivalent Next.js build against Notion.
          # Skip the duplicate Docker build, which is slow for legacy NotionNext
          # because it performs a second full remote content collection.
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == "temp/notionnext-production-rollback-20260903" ]]; then
            required=false
            reason="temporary NotionNext rollback already validated by Vercel preview"
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Docker build decision"
            echo
            echo "- required: \`$required\`"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast success for documentation-only change
        if: steps.docker_changes.outputs.required != 'true'
        run: |
          echo "Docker build skipped: ${{ steps.docker_changes.outputs.reason }}"
          echo "The required job/check name remains build and succeeds."

      - name: Set up Docker Buildx
        if: steps.docker_changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-architecture release
        if: >-
          steps.docker_changes.outputs.required == 'true' &&
          (startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.multiarch))
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log into registry ${{ env.REGISTRY }}
        if: >-
          steps.docker_changes.outputs.required == 'true' &&
          (startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.docker_changes.outputs.required == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build validation image
        if: >-
          steps.docker_changes.outputs.required == 'true' &&
          !startsWith(github.ref, 'refs/tags/') &&
          !(github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAW_TECH_STATIC_PREFETCH_MODE=skip
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64,ignore-error=true,timeout=2m
          provenance: false
          sbom: false

      - name: Build and push amd64 release image
        if: >-
          steps.docker_changes.outputs.required == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          !inputs.multiarch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAW_TECH_STATIC_PREFETCH_MODE=skip
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64,ignore-error=true,timeout=2m
          provenance: false
          sbom: false

      - name: Build and push multi-architecture release image
        if: >-
          steps.docker_changes.outputs.required == 'true' &&
          (startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.multiarch))
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAW_TECH_STATIC_PREFETCH_MODE=skip
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release,ignore-error=true,timeout=3m
          provenance: false
          sbom: false
