name: Docker ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether Docker build is required
        id: docker_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required=true
          reason="push, tag, or manual run"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            required=false
            reason="documentation-only pull request"
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                docs/*|*.md|*.mdx|.github/pull_request_template.md)
                  ;;
                *)
                  required=true
                  reason="build-relevant path: $path"
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Docker build decision"
            echo
            echo "- required: \`$required\`"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast success for documentation-only pull request
        if: steps.docker_changes.outputs.required != 'true'
        run: |
          echo "Docker build skipped: ${{ steps.docker_changes.outputs.reason }}"
          echo "The required job/check name remains build and succeeds."

      - name: Set up Docker Buildx
        if: steps.docker_changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.docker_changes.outputs.required == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.docker_changes.outputs.required == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: steps.docker_changes.outputs.required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAW_TECH_STATIC_PREFETCH_MODE=skip
          cache-from: type=gha,scope=docker-ghcr
          cache-to: type=gha,mode=max,scope=docker-ghcr
