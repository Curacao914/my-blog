name: Course Worker LLM Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-worker-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only LLM task diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COURSE_CONTROL_PLANE_URL: ${{ secrets.COURSE_CONTROL_PLANE_URL }}
      COURSE_WORKER_SECRET: ${{ secrets.COURSE_WORKER_SECRET }}
      COURSE_WORKER_OWNER_ID: ${{ secrets.COURSE_WORKER_OWNER_ID }}
      COURSE_CONTROL_PLANE_TIMEOUT_MS: "120000"

    steps:
      - name: Check out worker
        uses: actions/checkout@v5
        with:
          ref: codex/course-worker-v009c
          path: worker
          persist-credentials: false

      - name: Read task failures only
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import './worker/scripts/course-worker/worker-env.mjs'
          import {
            createCoursePipelineWorkerClient
          } from './worker/scripts/course-worker/pipeline-worker-client.mjs'

          const replayKeys = [
            'replay-664cc81facb85b81f547c92d',
            'replay-f2e56a9ac6b04620808b652c'
          ]

          function clean(value) {
            return String(value || '')
              .replace(/[\r\n\t]+/g, ' ')
              .replace(/\s+/g, ' ')
              .slice(0, 2500)
          }

          const client = createCoursePipelineWorkerClient()

          for (const replayKey of replayKeys) {
            const response = await client.get(replayKey)
            const task = response.task || response
            const error = task.last_error || task.lastError || {}

            console.log('TASK_DIAGNOSIS ' + JSON.stringify({
              replayKey,
              stage: task.stage || '',
              courseJobId: task.artifacts?.courseJobId || '',
              noteWorkflowStatus:
                task.runtime?.noteWorkflowStatus || '',
              attemptCount: Number(
                task.attempt_count ||
                task.attemptCount ||
                0
              ),
              nextAttemptAt:
                task.next_attempt_at ||
                task.nextAttemptAt ||
                '',
              error: {
                kind: error.kind || '',
                code: error.code || '',
                message: clean(error.message),
                retryable: Boolean(error.retryable)
              }
            }))
          }
          NODE
