name: Production article body smoke

on:
  push:
    branches:
      - test/prod-body-smoke-20260903

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify rendered body on production
        run: |
          python - <<'PY'
          import time
          import urllib.request

          needle = '本笔记按知识体系（而非课次顺序）重新组织'
          url = f'https://law-tech.dev/article/wuzhaifa?smoke={int(time.time())}'
          request = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'law-tech-production-smoke/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode('utf-8', 'replace')
              status = response.status

          print(f'HTTP status: {status}')
          print(f'HTML bytes: {len(html.encode("utf-8"))}')
          print(f'Body needle present: {needle in html}')
          print(f'Loading placeholder present: {"Loading..." in html}')

          if status != 200:
              raise SystemExit(f'Expected HTTP 200, got {status}')
          if needle not in html:
              raise SystemExit('Rendered Notion body text was not found in production HTML')

          print('PASS: production article body is rendered')
          PY
