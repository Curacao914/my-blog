name: Course Worker Production

on:
  # Lightweight control-plane check every 30 minutes. The heavy worker
  # starts only once after the user-configured Asia/Shanghai time.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Health check only, or one complete production cycle
        required: true
        default: health
        type: choice
        options:
          - health
          - cycle
      allowlist:
        description: Use * for all current-semester courses, or exact names separated by commas
        required: true
        default: '*'
        type: string

permissions:
  contents: read

concurrency:
  group: course-worker-production
  cancel-in-progress: false

jobs:
  remote-worker:
    name: Remote course worker
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_CONTROL_PLANE_URL: ${{ secrets.COURSE_CONTROL_PLANE_URL }}
      COURSE_WORKER_SECRET: ${{ secrets.COURSE_WORKER_SECRET }}
      COURSE_WORKER_OWNER_ID: ${{ secrets.COURSE_WORKER_OWNER_ID }}
      PKU_USERNAME: ${{ secrets.PKU_USERNAME }}
      PKU_PASSWORD: ${{ secrets.PKU_PASSWORD }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      COURSE_PIPELINE_ALLOWLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.allowlist != '*' && inputs.allowlist || '' }}
      COURSE_PIPELINE_MAX_TASKS: "20"
      COURSE_LLM_MAX_TASKS_PER_CYCLE: "20"
      COURSE_LLM_MAX_BATCHES_PER_TASK: "160"
      COURSE_LLM_MAX_BATCHES_PER_CYCLE: "600"
      COURSE_LLM_COST_MODE: economy
      COURSE_CLEANUP_MEDIA: "1"
      COURSE_AUTO_APPROVE_OUTLINE: "1"
      COURSE_ASR_ALLOW_PAID: "1"
      COURSE_ASR_MAX_TASK_SECONDS: "16200"
      COURSE_ASR_DAILY_MAX_SECONDS: "0"
      COURSE_ASR_MAX_TASK_COST_CNY: "2"
      COURSE_ASR_DAILY_MAX_COST_CNY: "0"
      COURSE_CONTROL_PLANE_TIMEOUT_MS: "120000"
      COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS: "300000"
      COURSE_DOWNLOAD_CONCURRENCY: "4"
      COURSE_HEADLESS: "1"
      COURSE_PROXY_MODE: off
      COURSE_MEDIA_ROUTE: inherit
      COURSE_WORKER_ID: gha:${{ github.run_id }}

    steps:
      - name: Check out worker branch
        uses: actions/checkout@v5
        with:
          ref: codex/course-worker-v009c
          persist-credentials: false

      - name: Validate remote-worker configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            COURSE_CONTROL_PLANE_URL
            COURSE_WORKER_SECRET
            PKU_USERNAME
            PKU_PASSWORD
            DASHSCOPE_API_KEY
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ENDPOINT
            R2_BUCKET
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.allowlist }}" != "*" && -z "${COURSE_PIPELINE_ALLOWLIST:-}" ]]; then
            echo 'Manual course allowlist is empty.'
            exit 1
          fi
          echo 'Required remote-worker configuration is present.'

      - name: Resolve course automation plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          trigger='scheduled'
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "${{ inputs.mode }}" == 'cycle' ]]; then
              trigger='manual-cycle'
            else
              trigger='health'
            fi
          fi
          response="$(curl -fsS             -H "Authorization: Bearer $COURSE_WORKER_SECRET"             -H "x-law-tech-owner-id: $COURSE_WORKER_OWNER_ID"             -H 'content-type: application/json'             -d "$(jq -nc --arg trigger "$trigger" '{action:"plan",trigger:$trigger}')"             "${COURSE_CONTROL_PLANE_URL%/}/api/courses/pipeline/schedule-plan")"
          echo "run_cycle=$(jq -r '.plan.runCycle // false' <<<"$response")" >> "$GITHUB_OUTPUT"
          echo "date_key=$(jq -r '.plan.dateKey // empty' <<<"$response")" >> "$GITHUB_OUTPUT"
          cost_mode="$(jq -r '.plan.costMode // "economy"' <<<"$response")"
          cleanup_media="$(jq -r 'if .plan.cleanupMedia == false then "0" else "1" end' <<<"$response")"
          auto_approve_outline="$(jq -r 'if .plan.autoApproveOutline == false then "0" else "1" end' <<<"$response")"
          echo "cost_mode=$cost_mode" >> "$GITHUB_OUTPUT"
          echo "cleanup_media=$cleanup_media" >> "$GITHUB_OUTPUT"
          echo "auto_approve_outline=$auto_approve_outline" >> "$GITHUB_OUTPUT"
          echo "COURSE_LLM_COST_MODE=$cost_mode" >> "$GITHUB_ENV"
          echo "COURSE_CLEANUP_MEDIA=$cleanup_media" >> "$GITHUB_ENV"
          echo "COURSE_AUTO_APPROVE_OUTLINE=$auto_approve_outline" >> "$GITHUB_ENV"
          jq '{ok, plan}' <<<"$response"

      - name: Build worker image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.plan.outputs.run_cycle == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file deploy/course-worker/Dockerfile \
            --tag law-tech-course-worker:remote-test \
            .

      - name: Prepare ephemeral worker storage
        if: ${{ github.event_name == 'workflow_dispatch' || steps.plan.outputs.run_cycle == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-worker-data"
          chmod 700 "$RUNNER_TEMP/course-worker-data"

      - name: Run remote health check
        if: ${{ github.event_name == 'workflow_dispatch' || steps.plan.outputs.run_cycle == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/course-worker-health.log"
          health_args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "${{ inputs.allowlist }}" == "*" ]]; then
            health_args+=(--all)
          fi
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_PIPELINE_ALLOWLIST \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_WORKER_ID \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            law-tech-course-worker:remote-test \
            health "${health_args[@]}" >"$log" 2>&1
          status=$?
          set -e
          health_json="$RUNNER_TEMP/course-worker-data/scratch/health/latest.json"
          if [[ -f "$health_json" ]]; then
            jq '{ok, checks}' "$health_json"
          fi
          if (( status != 0 )); then
            echo 'Remote health check failed. Detailed output was kept out of this public workflow log.'
            exit "$status"
          fi

      - name: Run one complete production cycle
        if: ${{ (github.event_name == 'schedule' && steps.plan.outputs.run_cycle == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'cycle') }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/course-worker-cycle.log"
          cycle_args=(
            --max-tasks 20
            --since-days 14
            --cost-mode "${{ steps.plan.outputs.cost_mode }}"
          )
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "${{ inputs.allowlist }}" == "*" ]]; then
            cycle_args+=(--all)
          fi
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_PIPELINE_ALLOWLIST \
            -e COURSE_PIPELINE_MAX_TASKS \
            -e COURSE_LLM_MAX_TASKS_PER_CYCLE \
            -e COURSE_LLM_MAX_BATCHES_PER_TASK \
            -e COURSE_LLM_MAX_BATCHES_PER_CYCLE \
            -e COURSE_LLM_COST_MODE \
            -e COURSE_CLEANUP_MEDIA \
            -e COURSE_AUTO_APPROVE_OUTLINE \
            -e COURSE_ASR_ALLOW_PAID \
            -e COURSE_ASR_MAX_TASK_SECONDS \
            -e COURSE_ASR_DAILY_MAX_SECONDS \
            -e COURSE_ASR_MAX_TASK_COST_CNY \
            -e COURSE_ASR_DAILY_MAX_COST_CNY \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_DOWNLOAD_CONCURRENCY \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_WORKER_ID \
            law-tech-course-worker:remote-test \
            cycle "${cycle_args[@]}" >"$log" 2>&1
          status=$?
          set -e

          mapfile -t llm_summaries < <(
            find "$RUNNER_TEMP/course-worker-data/scratch/runs" \
              -path '*/llm-*/summary.json' -type f -print 2>/dev/null |
              sort
          )
          media_summary="$(
            find "$RUNNER_TEMP/course-worker-data/scratch/runs" \
              -path '*/cycle-*/summary.json' -type f -print 2>/dev/null |
              sort |
              tail -1 || true
          )"

          print_llm_summary() {
            local stage="$1"
            local file="${2:-}"
            if [[ -n "$file" && -f "$file" ]]; then
              jq --arg stage "$stage" '{
                stage: $stage,
                status: (.status // ""),
                counts: (.counts // {}),
                errorCode: (.error.code // "")
              }' "$file"
            else
              jq -n --arg stage "$stage" '{
                stage: $stage,
                status: "summary-missing",
                counts: {},
                errorCode: ""
              }'
            fi
          }

          print_media_summary() {
            local file="${1:-}"
            if [[ -n "$file" && -f "$file" ]]; then
              jq '{
                stage: "discover-and-preprocess-media",
                status: (.status // ""),
                counts: (.counts // {}),
                discovery: (
                  if .discovery then {
                    scannedCourses: (.discovery.scannedCourses // 0),
                    selectedReplays: (.discovery.selectedReplays // 0),
                    newlyAdded: (.discovery.newlyAdded // 0)
                  } else {} end
                ),
                errorCode: (.error.code // "")
              }' "$file"
            else
              jq -n '{
                stage: "discover-and-preprocess-media",
                status: "summary-missing",
                counts: {},
                discovery: {},
                errorCode: ""
              }'
            fi
          }

          echo 'Safe production stage summaries:'
          print_llm_summary \
            "drain-existing-llm" \
            "${llm_summaries[0]-}"
          print_media_summary "$media_summary"
          print_llm_summary \
            "drain-newly-imported-llm" \
            "${llm_summaries[1]-}"

          if (( status != 0 )); then
            echo 'Remote production cycle failed or needs hard attention. Detailed course content was kept out of this public workflow log.'
            exit "$status"
          fi
          echo 'Remote production cycle completed without a hard failure.'

      - name: Record scheduled cycle completion
        if: ${{ success() && github.event_name == 'schedule' && steps.plan.outputs.run_cycle == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $COURSE_WORKER_SECRET"             -H "x-law-tech-owner-id: $COURSE_WORKER_OWNER_ID"             -H 'content-type: application/json'             -d "$(jq -nc --arg dateKey "${{ steps.plan.outputs.date_key }}" '{action:"ack",dateKey:$dateKey}')"             "${COURSE_CONTROL_PLANE_URL%/}/api/courses/pipeline/schedule-plan" | jq '{ok, acknowledged, dateKey}'
