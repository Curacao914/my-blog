name: Course Worker Production

on:
  # Teaching-platform discovery runs every 12 hours: 08:00 and 20:00 Asia/Shanghai.
  # Course-note generation starts once in the historical low-cost window: 00:30 Asia/Shanghai.
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a health check, teaching-platform scan, note drain, or full manual cycle
        required: true
        default: health
        type: choice
        options:
          - health
          - media
          - notes
          - full
      allowlist:
        description: Use * for all current-semester courses, or exact names separated by commas
        required: true
        default: '*'
        type: string

permissions:
  contents: read

concurrency:
  group: course-worker-production
  cancel-in-progress: false

jobs:
  remote-worker:
    name: Remote course worker
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_CONTROL_PLANE_URL: ${{ secrets.COURSE_CONTROL_PLANE_URL }}
      COURSE_WORKER_SECRET: ${{ secrets.COURSE_WORKER_SECRET }}
      COURSE_WORKER_OWNER_ID: ${{ secrets.COURSE_WORKER_OWNER_ID }}
      PKU_USERNAME: ${{ secrets.PKU_USERNAME }}
      PKU_PASSWORD: ${{ secrets.PKU_PASSWORD }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      COURSE_PIPELINE_ALLOWLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.allowlist != '*' && inputs.allowlist || '' }}
      COURSE_PIPELINE_MAX_TASKS: '20'
      COURSE_LLM_MAX_TASKS_PER_CYCLE: '20'
      COURSE_LLM_MAX_BATCHES_PER_TASK: '160'
      COURSE_LLM_MAX_BATCHES_PER_CYCLE: '600'
      COURSE_LLM_COST_MODE: economy
      COURSE_CLEANUP_MEDIA: '1'
      COURSE_AUTO_APPROVE_OUTLINE: '1'
      COURSE_ASR_ALLOW_PAID: '1'
      COURSE_ASR_MAX_TASK_SECONDS: '16200'
      COURSE_ASR_DAILY_MAX_SECONDS: '0'
      COURSE_ASR_MAX_TASK_COST_CNY: '2'
      COURSE_ASR_DAILY_MAX_COST_CNY: '0'
      COURSE_CONTROL_PLANE_TIMEOUT_MS: '120000'
      COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS: '300000'
      COURSE_DOWNLOAD_CONCURRENCY: '4'
      COURSE_HEADLESS: '1'
      COURSE_PROXY_MODE: 'off'
      COURSE_MEDIA_ROUTE: inherit
      COURSE_WORKER_ID: gha:${{ github.run_id }}

    steps:
      - name: Check out worker source
        uses: actions/checkout@v5
        with:
          # Scheduled runs always use the current production branch. A manually
          # dispatched feature branch tests its own code before merge.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          persist-credentials: false

      - name: Validate remote-worker configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            COURSE_CONTROL_PLANE_URL
            COURSE_WORKER_SECRET
            COURSE_WORKER_OWNER_ID
            PKU_USERNAME
            PKU_PASSWORD
            DASHSCOPE_API_KEY
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ENDPOINT
            R2_BUCKET
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "${{ inputs.allowlist }}" != '*' && -z "${COURSE_PIPELINE_ALLOWLIST:-}" ]]; then
            echo 'Manual course allowlist is empty.'
            exit 1
          fi
          echo 'Required remote-worker configuration is present.'

      - name: Resolve scheduled operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            operation='${{ inputs.mode }}'
          elif [[ "${{ github.event.schedule }}" == '30 16 * * *' ]]; then
            operation='notes'
          else
            operation='media'
          fi
          case "$operation" in
            health|media|notes|full) ;;
            *) echo "Unsupported operation: $operation"; exit 1 ;;
          esac
          echo "value=$operation" >> "$GITHUB_OUTPUT"
          echo "Resolved operation: $operation"

      - name: Build worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file deploy/course-worker/Dockerfile \
            --tag law-tech-course-worker:production \
            .

      - name: Prepare ephemeral worker storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-worker-data"
          chmod 700 "$RUNNER_TEMP/course-worker-data"

      - name: Run remote health check
        if: ${{ steps.operation.outputs.value == 'health' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.allowlist || '*' }}" == '*' ]]; then args+=(--all); fi
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_PIPELINE_ALLOWLIST \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_WORKER_ID \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            law-tech-course-worker:production \
            health "${args[@]}"

      - name: Discover, download and transcribe new replays
        if: ${{ steps.operation.outputs.value == 'media' || steps.operation.outputs.value == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/course-worker-media.log"
          args=(--max-tasks 20 --since-days 14)
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "${{ inputs.allowlist || '*' }}" == '*' ]]; then args+=(--all); fi
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e PKU_USERNAME \
            -e PKU_PASSWORD \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_PIPELINE_ALLOWLIST \
            -e COURSE_PIPELINE_MAX_TASKS \
            -e COURSE_CLEANUP_MEDIA \
            -e COURSE_AUTO_APPROVE_OUTLINE \
            -e COURSE_ASR_ALLOW_PAID \
            -e COURSE_ASR_MAX_TASK_SECONDS \
            -e COURSE_ASR_DAILY_MAX_SECONDS \
            -e COURSE_ASR_MAX_TASK_COST_CNY \
            -e COURSE_ASR_DAILY_MAX_COST_CNY \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_DOWNLOAD_CONCURRENCY \
            -e COURSE_HEADLESS \
            -e COURSE_PROXY_MODE \
            -e COURSE_MEDIA_ROUTE \
            -e COURSE_WORKER_ID \
            law-tech-course-worker:production \
            media-cycle "${args[@]}" >"$log" 2>&1
          status=$?
          set -e
          summary="$(find "$RUNNER_TEMP/course-worker-data/scratch/runs" -path '*/cycle-*/summary.json' -type f -print 2>/dev/null | sort | tail -1 || true)"
          if [[ -n "$summary" && -f "$summary" ]]; then
            jq '{status, counts, discovery: {scannedCourses: (.discovery.scannedCourses // 0), selectedReplays: (.discovery.selectedReplays // 0), newlyAdded: (.discovery.newlyAdded // 0)}, errorCode: (.error.code // "")}' "$summary"
          fi
          if (( status != 0 )); then
            echo 'Course discovery or transcription needs attention. Detailed course content was kept out of this public workflow log.'
            exit "$status"
          fi
          echo 'Teaching-platform scan and immediate transcription completed.'

      - name: Generate queued notes in economy mode
        if: ${{ steps.operation.outputs.value == 'notes' || steps.operation.outputs.value == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/course-worker-notes.log"
          args=(
            --max-tasks 20
            --max-batches-per-task 160
            --max-batches 600
            --cost-mode economy
          )
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "${{ inputs.allowlist || '*' }}" == '*' ]]; then args+=(--all); fi
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/course-worker-data:/data" \
            -e COURSE_CONTROL_PLANE_URL \
            -e COURSE_WORKER_SECRET \
            -e COURSE_WORKER_OWNER_ID \
            -e DASHSCOPE_API_KEY \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT \
            -e R2_BUCKET \
            -e COURSE_PIPELINE_ALLOWLIST \
            -e COURSE_LLM_MAX_TASKS_PER_CYCLE \
            -e COURSE_LLM_MAX_BATCHES_PER_TASK \
            -e COURSE_LLM_MAX_BATCHES_PER_CYCLE \
            -e COURSE_LLM_COST_MODE \
            -e COURSE_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_LLM_CONTROL_PLANE_TIMEOUT_MS \
            -e COURSE_WORKER_ID \
            law-tech-course-worker:production \
            llm "${args[@]}" >"$log" 2>&1
          status=$?
          set -e
          summary="$(find "$RUNNER_TEMP/course-worker-data/scratch/runs" -path '*/llm-*/summary.json' -type f -print 2>/dev/null | sort | tail -1 || true)"
          if [[ -n "$summary" && -f "$summary" ]]; then
            jq '{status, counts, errorCode: (.error.code // "")}' "$summary"
          fi
          if (( status != 0 )); then
            echo 'Course-note generation needs attention. Detailed course content was kept out of this public workflow log.'
            exit "$status"
          fi
          echo 'Queued course notes were processed in economy mode.'
