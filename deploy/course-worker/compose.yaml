services:
  course-worker:
    build:
      context: ../..
      dockerfile: deploy/course-worker/Dockerfile
    env_file:
      - ${COURSE_WORKER_ENV_FILE:-../../.env.course-worker.local}
    environment:
      COURSE_WORKER_SCRATCH_DIR: /data/scratch
      COURSE_BROWSER_PROFILE_DIR: /data/browser-profile
      COURSE_HEADLESS: "1"
      COURSE_PROXY_MODE: "off"
      COURSE_MEDIA_ROUTE: "inherit"
    volumes:
      - ${COURSE_WORKER_DATA_DIR:-./data}:/data
    restart: "no"
